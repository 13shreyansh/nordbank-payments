name: Payment checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - name: Check this request
        run: python -c "import json,subprocess,pathlib; p=pathlib.Path('.tieto-case.json'); subprocess.run(['python','-m','pytest','-q',*json.loads(p.read_text())['tests']],check=True) if p.exists() else None"
